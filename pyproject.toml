[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-game-stat-pipeline"
version = "0.1.0"
description = "Replay historical NHL play-by-play into Kafka and compare live skater totals against a Hockey Reference baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "confluent-kafka>=2.5.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-storage>=2.18.0",
    "google-cloud-bigquery>=3.25.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = { find = { include = ["pipelines*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
